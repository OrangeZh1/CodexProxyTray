[package]
name = "codex-proxy-tray"
version = "0.2.6"
description = "ChatGPT desktop and Codex CLI proxy companion"
edition = "2021"
default-run = "CodexProxyTray"
license = "MIT"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "CodexProxyTray"
path = "src/main.rs"

[[bin]]
name = "codex-proxy-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows = { version = "=0.62.2", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Time", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Services", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
codegen-units = 1
strip = true
panic = "unwind"
