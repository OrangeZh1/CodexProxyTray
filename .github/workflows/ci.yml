name: CodexProxyTray CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-proxy-tray-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=1024
  CARGO_BUILD_JOBS: 2
  RUST_VERSION: 1.99.1

jobs:
  installer-bootstrap:
    name: Windows 安装器启动交接检查
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 验证实际安装器抵达目录保护门禁
        shell: pwsh
        run: ./tests/Test-InstallerBootstrap.ps1 -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-bootstrap-evidence"
      - name: 保存安装器启动交接证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-bootstrap-evidence
          path: ${{ runner.temp }}/CodexProxyTray-bootstrap-evidence/
          if-no-files-found: ignore
          retention-days: 7

  checks:
    name: 逻辑检查与前端构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 安装锁定的前端依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 准备 Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
      - name: Rust 核心检查
        run: |
          rustc +"$RUST_VERSION" --edition=2021 --test src-tauri/src/core.rs -o "$RUNNER_TEMP/core-tests"
          "$RUNNER_TEMP/core-tests"
      - name: JavaScript 交互与更新检查
        run: node --test --test-reporter=tap --test-concurrency=1 tests/*.test.mjs
      - name: 构建前端
        run: npm run build:ui
      - name: 实际 JSX 渲染检查
        run: npm run check:ui
      - name: 生产界面客户端启动检查
        run: npm run check:client
      - name: 传递内嵌页面
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64 原生构建与 CLI 检查
    needs: [checks, installer-bootstrap]
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist/
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: windows-native-v1-${{ env.RUST_VERSION }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-native-v1-${{ env.RUST_VERSION }}-
      - name: 准备 Windows Rust
        shell: pwsh
        run: rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc --no-self-update
      - name: 编译内嵌界面的程序
        id: native-build
        shell: pwsh
        run: cargo "+$env:RUST_VERSION" build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bins --features custom-protocol
      - name: 保存可复用的原生编译缓存
        if: always() && steps.native-build.outcome != 'skipped' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Windows 配置迁移与边界检查
        id: native-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $testExecutables=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          cargo "+$env:RUST_VERSION" test --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bin CodexProxyTray --features custom-protocol --message-format=json | ForEach-Object {
            $line=[string]$_
            Write-Host $line
            if($line.StartsWith('{')){
              try {$message=$line|ConvertFrom-Json -ErrorAction Stop}catch{return}
              if($message.reason -eq 'compiler-artifact' -and $message.target.name -ceq 'CodexProxyTray' -and $message.profile.test -eq $true -and $message.executable){[void]$testExecutables.Add([IO.Path]::GetFullPath([string]$message.executable))}
            }
          }
          $testExit=$LASTEXITCODE
          if($testExit -ne 0){exit $testExit}
          if($testExecutables.Count -ne 1){throw 'Expected exactly one test executable from this cargo test invocation.'}
          $testExecutable=@($testExecutables)[0]
          if(-not (Test-Path -LiteralPath $testExecutable -PathType Leaf) -or $testExecutable.Contains("`n") -or $testExecutable.Contains("`r")){throw 'The current test executable is missing or invalid.'}
          "service_probe_executable=$testExecutable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: 真实公开更新附件下载检查
        timeout-minutes: 4
        shell: pwsh
        env:
          CODEX_PROXY_PUBLIC_DOWNLOAD_PROBE_RESULT: ${{ runner.temp }}/public-download-probe.json
        run: |
          & '${{ steps.native-tests.outputs.service_probe_executable }}' app_update::tests::published_update_download_probe --ignored --exact --test-threads=1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: 保存公开下载检查证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-download-evidence
          path: ${{ runner.temp }}/public-download-probe.json
          if-no-files-found: ignore
          retention-days: 7
      - name: 真实 ETW 回环流量与会话收尾检查
        timeout-minutes: 3
        shell: pwsh
        run: cargo "+$env:RUST_VERSION" test --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bin CodexProxyTray --features custom-protocol traffic_etw::tests::etw_loopback_counts_only_verified_targets_and_stops -- --ignored --exact --test-threads=1
      - name: 隔离 CLI 验收
        shell: pwsh
        run: ./tests/Test-Cli.ps1 -BinaryPath "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/codex-proxy-cli.exe" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-cli-evidence"
      - name: 保存 CLI 验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-evidence
          path: ${{ runner.temp }}/CodexProxyTray-cli-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 打包必要运行文件与第三方许可
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cargoRoot=if($env:CARGO_HOME){$env:CARGO_HOME}else{Join-Path $env:USERPROFILE '.cargo'}
          $loaders=@(Get-ChildItem -LiteralPath (Join-Path $cargoRoot 'registry/src') -Directory | ForEach-Object { Join-Path $_.FullName 'webview2-com-sys-0.39.1/x64/WebView2Loader.dll' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if($loaders.Count -ne 1){throw 'Expected one locked x64 WebView2 loader.'}
          $loaderPath=$loaders[0]
          node scripts/package-windows.mjs --bin-dir "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release" --loader "$loaderPath" --out package
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: 隔离验证辅助服务安装与卸载
        shell: pwsh
        run: ./tests/Test-TrafficService.ps1 -BinaryPath "${{ github.workspace }}/package/CodexProxyTray.exe" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-service-evidence" -ServiceProbePath "${{ steps.native-tests.outputs.service_probe_executable }}"
      - name: 真实主窗口与托盘前端启动检查
        shell: pwsh
        run: ./tests/Test-DesktopStartup.ps1 -BinaryPath "${{ github.workspace }}/package/CodexProxyTray.exe" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-desktop-evidence"
      - name: 整理并校验 GitHub 正式发行附件
        shell: pwsh
        run: ./scripts/package-release.ps1 -PackageDirectory "${{ github.workspace }}/package" -OutputDirectory "${{ github.workspace }}/release" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-release-evidence"
      - name: 构建并校验每用户 Windows 安装器
        shell: pwsh
        run: ./scripts/package-installer.ps1 -ReleaseDirectory "${{ github.workspace }}/release" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-installer-package-evidence"
      - name: 隔离验证助手安装更新与失败回退
        shell: pwsh
        run: ./tests/Test-AppUpdate.ps1 -ReleaseDirectory "${{ github.workspace }}/release" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-updater-evidence"
      - name: 隔离验证标准安装与卸载注册
        shell: pwsh
        run: ./tests/Test-Installer.ps1 -ReleaseDirectory "${{ github.workspace }}/release" -EvidenceDirectory "$env:RUNNER_TEMP/CodexProxyTray-installer-evidence"
      - name: 保存 Windows 安装器验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-evidence
          path: |
            ${{ runner.temp }}/CodexProxyTray-installer-evidence/
            ${{ runner.temp }}/CodexProxyTray-installer-package-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 保存助手更新验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-evidence
          path: ${{ runner.temp }}/CodexProxyTray-updater-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 保存正式发行附件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexProxyTray-release
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: 保存发行附件校验证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: ${{ runner.temp }}/CodexProxyTray-release-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 保存真实前端启动证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-startup-evidence
          path: ${{ runner.temp }}/CodexProxyTray-desktop-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 保存辅助服务验收证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-evidence
          path: ${{ runner.temp }}/CodexProxyTray-service-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: 保存验收产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexProxyTray-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 7
